<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leaderboard — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { padding-top: 70px; }
    .page-wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }
    .page-header { text-align: center; margin-bottom: 40px; }
    .page-header h1 { font-size: clamp(1.4rem,4vw,2rem); margin-bottom: 8px; }
    .page-header p { color: var(--text-muted); font-size: 0.9rem; }
    .top3 { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 12px; margin-bottom: 36px; }
    .podium-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 12px; text-align: center; transition: var(--transition); }
    .podium-card.rank1 { border-color: var(--warning); box-shadow: 0 0 24px rgba(245,158,11,0.15); }
    .podium-rank { font-size: 1.4rem; margin-bottom: 8px; }
    .podium-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-secondary); border: 2px solid var(--border); margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.1rem; color: var(--accent); }
    .podium-name { font-family: var(--font-display); font-size: 0.78rem; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-xp { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent3); }
    .podium-level { margin-top: 8px; }
    .lb-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .your-banner { background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.22); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-family: var(--font-mono); font-size: 0.78rem; }
    .your-banner span { color: var(--accent); }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>
<nav class="navbar"></nav>
<div class="nav-mobile-menu" id="navMobileMenu"></div>

<div class="page-wrap">
  <div class="page-header">
    <h1>🏆 Leaderboard</h1>
    <p>Top SQL warriors ranked by XP. Rise through the tiers. Claim your spot.</p>
  </div>
  <div id="yourBanner"></div>
  <div class="top3" id="top3"></div>
  <div class="lb-wrap">
    <div class="lb-row header">
      <div class="lb-rank" style="font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);">Rank</div>
      <div style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;">Player</div>
      <div style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;">XP</div>
      <div style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;text-align:right;">Tier</div>
    </div>
    <div id="lbList"></div>
  </div>
</div>

<footer class="footer">
  <div class="footer-logo">⬡ QueryQuest</div>
  <div class="footer-links"><a href="challenges.html">Challenges</a><a href="adventures.html">Adventures</a></div>
</footer>

<script src="../js/main.js"></script>
<script src="../js/nav-inject.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  buildNav('leaderboard');
  render();
});
function render() {
  const user = QQ.getUser();
  let board = JSON.parse(localStorage.getItem('qq_leaderboard')||'[]');
  const demos=[{username:'sql_master_99',xp:1850,level:'Expert'},{username:'query_queen',xp:1200,level:'Expert'},{username:'data_wizard',xp:750,level:'Advanced'},{username:'table_joiner',xp:420,level:'Advanced'},{username:'select_star',xp:190,level:'Skilled'}];
  demos.forEach(d=>{if(!board.find(e=>e.username===d.username))board.push(d);});
  board.sort((a,b)=>b.xp-a.xp);

  if (user) {
    const myRank = board.findIndex(e=>e.username===user.username)+1;
    if (myRank>0) document.getElementById('yourBanner').innerHTML=`<div class="your-banner"><span>Your rank: <span>#${myRank}</span></span><span>XP: <span>${user.xp||0}</span></span><span>Tier: <span>${user.level||'Rookie'}</span></span></div>`;
  }

  // Podium (reorder: 2nd, 1st, 3rd)
  const top3=board.slice(0,3);
  const order=top3.length>=3?[top3[1],top3[0],top3[2]]:top3;
  const cls=['','rank1',''];const medals=['🥈','🥇','🥉'];
  let p3='';
  order.forEach((pl,i)=>{
    if(!pl)return;
    const isMe=user&&pl.username===user.username;
    p3+=`<div class="podium-card ${cls[i]}"><div class="podium-rank">${medals[i]}</div><div class="podium-avatar">${pl.username[0].toUpperCase()}</div><div class="podium-name">${pl.username}${isMe?' (you)':''}</div><div class="podium-xp">${pl.xp} XP</div><div class="podium-level"><span class="badge badge-${(pl.level||'rookie').toLowerCase()}">${pl.level||'Rookie'}</span></div></div>`;
  });
  document.getElementById('top3').innerHTML=p3;

  const list=document.getElementById('lbList');
  if(!board.length){list.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted);font-family:var(--font-mono);font-size:0.8rem;">No players yet. Be the first!</div>';return;}
  board.forEach((pl,idx)=>{
    const rank=idx+1;
    const isMe=user&&pl.username===user.username;
    const rc=rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
    list.innerHTML+=`<div class="lb-row ${isMe?'is-me':''}">
      <div class="lb-rank ${rc}">#${rank}</div>
      <div class="lb-user"><div class="lb-avatar">${pl.username[0].toUpperCase()}</div><div class="lb-username">${pl.username}${isMe?' <span style="color:var(--accent);font-size:0.65rem;">(you)</span>':''}</div></div>
      <div class="lb-xp">${pl.xp} XP</div>
      <div class="lb-level"><span class="badge badge-${(pl.level||'rookie').toLowerCase()}">${pl.level||'Rookie'}</span></div>
    </div>`;
  });
}
</script>
</body>
</html>

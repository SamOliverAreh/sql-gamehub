<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leaderboard — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { padding-top: 80px; }
    .page-layout { max-width: 800px; margin: 0 auto; padding: 48px 24px; position: relative; z-index: 1; }
    .page-header { margin-bottom: 40px; text-align: center; }
    .page-header h1 { font-size: 2rem; margin-bottom: 8px; }
    .page-header p { color: var(--text-muted); }
    .top3 { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 12px; margin-bottom: 40px; align-items: end; }
    .podium-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; transition: var(--transition); }
    .podium-card.rank1 { border-color: var(--warning); box-shadow: 0 0 30px rgba(245,158,11,0.2); }
    .podium-card.rank2 { border-color: var(--text-muted); }
    .podium-card.rank3 { border-color: #cd7f32; }
    .podium-rank { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 8px; }
    .podium-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--bg-secondary); border: 2px solid var(--border); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.2rem; color: var(--accent); }
    .podium-name { font-family: var(--font-display); font-size: 0.85rem; margin-bottom: 4px; }
    .podium-xp { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent3); }
    .podium-level { margin-top: 8px; }
    .leaderboard-table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .lb-row { display: grid; grid-template-columns: 60px 1fr 120px 120px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--border); transition: var(--transition); }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:hover { background: var(--bg-card-hover); }
    .lb-row.is-me { background: rgba(0, 212, 255, 0.05); border-left: 2px solid var(--accent); }
    .lb-row.header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
    .lb-rank { font-family: var(--font-display); font-size: 0.9rem; color: var(--text-muted); }
    .lb-rank.gold { color: var(--warning); }
    .lb-rank.silver { color: #9ca3af; }
    .lb-rank.bronze { color: #cd7f32; }
    .lb-user { display: flex; align-items: center; gap: 12px; }
    .lb-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-secondary); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 0.75rem; color: var(--accent); flex-shrink: 0; }
    .lb-username { font-family: var(--font-mono); font-size: 0.85rem; }
    .lb-xp { font-family: var(--font-mono); font-size: 0.82rem; color: var(--accent3); }
    .lb-level { text-align: right; }
    .empty-lb { padding: 60px; text-align: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.82rem; }
    .your-rank-banner { background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.25); border-radius: 10px; padding: 14px 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 0.8rem; }
    .your-rank-banner span { color: var(--accent); }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanline"></div>

  <nav class="navbar">
    <a href="../index.html" class="nav-logo"><span>⬡</span><span class="logo-text">QueryQuest</span></a>
    <div class="nav-links">
      <a href="challenges.html">Challenges</a>
      <a href="leaderboard.html" style="color:var(--accent)">Leaderboard</a>
    </div>
    <div class="nav-auth" id="navAuth">
      <a href="login.html" class="btn-ghost">Login</a>
      <a href="register.html" class="btn-primary">Register</a>
    </div>
  </nav>

  <div class="page-layout">
    <div class="page-header">
      <h1>🏆 Leaderboard</h1>
      <p>Top SQL warriors ranked by XP. Rise through the tiers. Claim your spot.</p>
    </div>

    <div id="yourRankBanner"></div>
    <div class="top3" id="top3"></div>
    <div class="leaderboard-table-wrap">
      <div class="lb-row header">
        <div class="lb-rank" style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;">Rank</div>
        <div style="font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;">Player</div>
        <div style="font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;">XP</div>
        <div style="font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;text-align:right;">Tier</div>
      </div>
      <div id="lbList"></div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../data/challenges.js"></script>
  <script>
    const user = QQ.getUser();

    // Update nav
    const navAuth = document.getElementById('navAuth');
    if (user) {
      navAuth.innerHTML = `
        <span style="font-family:var(--font-mono);font-size:0.8rem;color:var(--accent);margin-right:12px;">⚡ ${user.xp||0} XP</span>
        <a href="dashboard.html" class="btn-ghost">Dashboard</a>
      `;
    }

    function render() {
      // Add some demo players if board is empty for demo purposes
      let board = JSON.parse(localStorage.getItem('qq_leaderboard') || '[]');
      
      // Demo entries so the board isn't empty
      const demos = [
        { username: 'sql_master_99', xp: 1850, level: 'Expert' },
        { username: 'query_queen', xp: 1200, level: 'Expert' },
        { username: 'data_wizard', xp: 750, level: 'Advanced' },
        { username: 'table_joiner', xp: 420, level: 'Advanced' },
        { username: 'select_star', xp: 190, level: 'Skilled' },
      ];
      
      demos.forEach(d => {
        if (!board.find(e => e.username === d.username)) board.push(d);
      });
      board.sort((a, b) => b.xp - a.xp);

      // Your rank banner
      if (user) {
        const myRank = board.findIndex(e => e.username === user.username) + 1;
        if (myRank > 0) {
          document.getElementById('yourRankBanner').innerHTML = `
            <div class="your-rank-banner">
              <span>Your rank: <span>#${myRank}</span></span>
              <span>XP: <span>${user.xp || 0}</span></span>
              <span>Tier: <span>${user.level || 'Rookie'}</span></span>
            </div>
          `;
        }
      }

      // Top 3 podium
      const top3 = board.slice(0, 3);
      const displayOrder = top3.length >= 3 ? [top3[1], top3[0], top3[2]] : top3;
      const rankClass = ['rank2', 'rank1', 'rank3'];
      const rankEmoji = ['🥈', '🥇', '🥉'];
      const actualRank = [2, 1, 3];

      let podiumHTML = '';
      displayOrder.forEach((player, i) => {
        if (!player) return;
        const isMe = user && player.username === user.username;
        podiumHTML += `
          <div class="podium-card ${rankClass[i]}">
            <div class="podium-rank">${rankEmoji[i]}</div>
            <div class="podium-avatar">${player.username[0].toUpperCase()}</div>
            <div class="podium-name">${player.username}${isMe ? ' (you)' : ''}</div>
            <div class="podium-xp">${player.xp} XP</div>
            <div class="podium-level"><span class="badge badge-${(player.level||'rookie').toLowerCase()}">${player.level||'Rookie'}</span></div>
          </div>
        `;
      });
      document.getElementById('top3').innerHTML = podiumHTML;

      // Full list (from rank 4)
      const listDiv = document.getElementById('lbList');
      if (board.length === 0) {
        listDiv.innerHTML = '<div class="empty-lb">No players yet. Be the first!</div>';
        return;
      }

      board.forEach((player, idx) => {
        const rank = idx + 1;
        const isMe = user && player.username === user.username;
        const rankClass2 = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
        listDiv.innerHTML += `
          <div class="lb-row ${isMe ? 'is-me' : ''}">
            <div class="lb-rank ${rankClass2}">#${rank}</div>
            <div class="lb-user">
              <div class="lb-avatar">${player.username[0].toUpperCase()}</div>
              <div class="lb-username">${player.username}${isMe ? ' <span style="color:var(--accent);font-size:0.68rem;">(you)</span>' : ''}</div>
            </div>
            <div class="lb-xp">${player.xp} XP</div>
            <div class="lb-level"><span class="badge badge-${(player.level||'rookie').toLowerCase()}">${player.level||'Rookie'}</span></div>
          </div>
        `;
      });
    }

    render();
  </script>
</body>
</html>

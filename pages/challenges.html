<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Challenges — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { padding-top: 80px; }
    .page-layout { max-width: 1100px; margin: 0 auto; padding: 48px 24px; position: relative; z-index: 1; }
    .page-header { margin-bottom: 40px; }
    .page-header h1 { font-size: 2rem; margin-bottom: 8px; }
    .page-header p { color: var(--text-muted); }
    .filters { display: flex; gap: 10px; margin-bottom: 32px; flex-wrap: wrap; }
    .filter-btn {
      font-family: var(--font-mono); font-size: 0.75rem; padding: 8px 16px;
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text-muted); border-radius: 99px; cursor: pointer;
      transition: var(--transition); letter-spacing: 0.05em;
    }
    .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.08); }
    .tier-section { margin-bottom: 48px; }
    .tier-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .tier-icon-lg { font-size: 1.5rem; }
    .tier-title { font-family: var(--font-display); font-size: 1rem; }
    .tier-subtitle { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); }
    .tier-locked-banner { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.82rem; }
    .challenges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .challenge-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 24px; cursor: pointer; transition: var(--transition); position: relative; overflow: hidden;
      text-decoration: none; color: inherit; display: block;
    }
    .challenge-card:hover { border-color: var(--border-bright); transform: translateY(-3px); box-shadow: var(--glow); }
    .challenge-card.solved { border-color: rgba(16,185,129,0.3); }
    .challenge-card.solved::after {
      content: '✓';
      position: absolute; top: 12px; right: 12px;
      width: 24px; height: 24px; background: var(--accent3);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; color: var(--bg-primary); font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .ch-tier { margin-bottom: 8px; }
    .ch-title { font-family: var(--font-display); font-size: 0.95rem; margin-bottom: 8px; }
    .ch-desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
    .ch-footer { display: flex; align-items: center; justify-content: space-between; }
    .ch-concepts { display: flex; flex-wrap: wrap; gap: 6px; }
    .ch-xp { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent3); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanline"></div>

  <nav class="navbar">
    <a href="../index.html" class="nav-logo"><span>⬡</span><span class="logo-text">QueryQuest</span></a>
    <div class="nav-links">
      <a href="challenges.html" style="color:var(--accent)">Challenges</a>
      <a href="leaderboard.html">Leaderboard</a>
    </div>
    <div class="nav-auth" id="navAuth">
      <a href="login.html" class="btn-ghost">Login</a>
      <a href="register.html" class="btn-primary">Register</a>
    </div>
  </nav>

  <div class="page-layout">
    <div class="page-header">
      <h1>Challenges</h1>
      <p>42 challenges across 6 tiers. Work your way from SELECT basics to recursive CTEs.</p>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="filterTier(0, this)">All Tiers</button>
      <button class="filter-btn" onclick="filterTier(1, this)">🌱 Rookie</button>
      <button class="filter-btn" onclick="filterTier(2, this)">⚡ Amateur</button>
      <button class="filter-btn" onclick="filterTier(3, this)">🔗 Skilled</button>
      <button class="filter-btn" onclick="filterTier(4, this)">🧠 Advanced</button>
      <button class="filter-btn" onclick="filterTier(5, this)">🏆 Expert</button>
      <button class="filter-btn" onclick="filterTier(6, this)">⚡ Legendary</button>
    </div>

    <div id="challengesContainer"></div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../data/challenges.js"></script>
  <script>
    let activeFilter = 0;
    const user = QQ.getUser();
    const progress = QQ.getProgress();
    const userXP = user ? (user.xp || 0) : 0;

    // Update nav
    const navAuth = document.getElementById('navAuth');
    if (user) {
      navAuth.innerHTML = `
        <a href="dashboard.html" style="font-family:var(--font-mono);font-size:0.8rem;color:var(--accent);text-decoration:none;margin-right:12px;">⚡ ${user.xp || 0} XP</a>
        <a href="dashboard.html" class="btn-ghost">Dashboard</a>
      `;
    }

    function filterTier(tier, btn) {
      activeFilter = tier;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderChallenges();
    }

    function renderChallenges() {
      const container = document.getElementById('challengesContainer');
      container.innerHTML = '';
      const tiers = activeFilter === 0 ? TIERS : TIERS.filter(t => t.id === activeFilter);

      tiers.forEach(tier => {
        const tierChallenges = CHALLENGES_DATA.filter(c => c.tier === tier.id);
        const isUnlocked = userXP >= tier.minXP;

        const section = document.createElement('div');
        section.className = 'tier-section';
        section.id = `tier-${tier.id}`;

        const tierSolved = tierChallenges.filter(c => progress[c.id]?.solved).length;

        section.innerHTML = `
          <div class="tier-header">
            <div class="tier-icon-lg">${tier.icon}</div>
            <div>
              <div class="tier-title">${tier.name}</div>
              <div class="tier-subtitle">${tierChallenges.length} challenges · ${tier.minXP} XP required · ${tierSolved} solved</div>
            </div>
            <span class="badge badge-${tier.name.toLowerCase()}" style="margin-left:auto;">${isUnlocked ? 'Unlocked' : '🔒 Locked'}</span>
          </div>
        `;

        if (!isUnlocked && user) {
          section.innerHTML += `<div class="tier-locked-banner">🔒 Reach ${tier.minXP} XP to unlock ${tier.name} challenges. You have ${userXP} XP.</div>`;
        } else {
          const grid = document.createElement('div');
          grid.className = 'challenges-grid';
          tierChallenges.forEach(ch => {
            const solved = progress[ch.id]?.solved;
            const link = document.createElement('a');
            link.href = `challenge.html?id=${ch.id}`;
            link.className = `challenge-card${solved ? ' solved' : ''}`;
            link.innerHTML = `
              <div class="ch-tier"><span class="badge badge-${ch.tierName.toLowerCase()}">${ch.tierName}</span></div>
              <div class="ch-title">${ch.title}</div>
              <div class="ch-desc">${ch.description}</div>
              <div class="ch-footer">
                <div class="ch-concepts">${ch.concepts.slice(0,3).map(c => `<span class="level-tags"><span>${c}</span></span>`).join('')}</div>
                <div class="ch-xp">+${ch.xp} XP</div>
              </div>
            `;
            grid.appendChild(link);
          });
          section.appendChild(grid);
        }

        container.appendChild(section);
      });
    }

    renderChallenges();

    // Scroll to tier from URL param
    const params = new URLSearchParams(window.location.search);
    const lvl = params.get('level');
    if (lvl) {
      setTimeout(() => {
        document.getElementById(`tier-${lvl}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 200);
    }
  </script>
</body>
</html>

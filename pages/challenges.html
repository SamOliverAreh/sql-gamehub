<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Challenges — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { padding-top: 70px; }
    .page-layout { max-width: 1100px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: clamp(1.4rem,4vw,2rem); margin-bottom: 6px; }
    .page-header p { color: var(--text-muted); font-size: 0.9rem; }
    .filters { display: flex; gap: 8px; margin-bottom: 32px; flex-wrap: wrap; }
    .filter-btn { font-family: var(--font-mono); font-size: 0.72rem; padding: 7px 14px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); border-radius: 99px; cursor: pointer; transition: var(--transition); }
    .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.07); }
    .tier-section { margin-bottom: 44px; }
    .tier-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .tier-icon-lg { font-size: 1.4rem; }
    .tier-title { font-family: var(--font-display); font-size: 0.92rem; }
    .tier-subtitle { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); }
    .tier-locked-banner { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.8rem; }
    .challenges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .challenge-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 18px; cursor: pointer; transition: var(--transition); text-decoration: none; color: inherit; display: block; position: relative; overflow: hidden; }
    .challenge-card:hover:not(.ch-locked) { border-color: var(--border-bright); transform: translateY(-3px); box-shadow: var(--glow); }
    .challenge-card.solved { border-color: rgba(16,185,129,0.35); }
    .challenge-card.solved::after { content:'✓'; position:absolute; top:10px; right:10px; width:22px; height:22px; background:var(--accent3); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.65rem; color:var(--bg-primary); font-weight:bold; }
    /* FIX 4: sequential lock style */
    .challenge-card.ch-locked { opacity: 0.45; cursor: not-allowed; border-style: dashed; }
    .ch-lock-label { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-dim); margin-top: 8px; }
    .ch-tier { margin-bottom: 8px; }
    .ch-title { font-family: var(--font-display); font-size: 0.9rem; margin-bottom: 7px; }
    .ch-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.5; }
    .ch-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
    .ch-concepts { display: flex; flex-wrap: wrap; gap: 4px; }
    .ch-concepts span { font-family: var(--font-mono); font-size: 0.58rem; padding: 2px 6px; border-radius: 4px; background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.18); color: var(--accent); }
    .ch-xp { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent3); white-space: nowrap; }
    /* Loading state */
    .loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 80px 20px; gap: 16px; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-muted); }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>
<nav class="navbar"></nav>
<div class="nav-mobile-menu" id="navMobileMenu"></div>

<div class="page-layout">
  <div class="page-header">
    <h1>Challenges</h1>
    <p>Complete each challenge in order within a tier. Finish all challenges in a tier to unlock the next tier.</p>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="filterTier(0,this)">All Tiers</button>
    <button class="filter-btn" onclick="filterTier(1,this)">🌱 Rookie</button>
    <button class="filter-btn" onclick="filterTier(2,this)">⚡ Amateur</button>
    <button class="filter-btn" onclick="filterTier(3,this)">🔗 Skilled</button>
    <button class="filter-btn" onclick="filterTier(4,this)">🧠 Advanced</button>
    <button class="filter-btn" onclick="filterTier(5,this)">🏆 Expert</button>
    <button class="filter-btn" onclick="filterTier(6,this)">⚡ Legendary</button>
  </div>
  <!-- Loading state shown while restoring session -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading your progress...</div>
  </div>
  <div id="challengesContainer" style="display:none;"></div>
</div>

<footer class="footer">
  <div class="footer-logo">⬡ QueryQuest</div>
  <div class="footer-links"><a href="adventures.html">Adventures</a><a href="leaderboard.html">Leaderboard</a></div>
</footer>

<script src="../js/page-loader.js"></script>
<script src="../js/main.js"></script>
<script src="../js/nav-inject.js"></script>
<script src="../data/challenges.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  // FIX 4: block page and require auth or guest session to play
  const token  = localStorage.getItem('qq_token');
  const isAnon = QQ.isAnonymous();
  if (!token && !isAnon) {
    // Not logged in and not a guest — redirect to register
    window.location.href = 'register.html';
    return;
  }
  PageLoader.show('Loading Challenges', 'Fetching your progress...');
  buildNav('challenges');
  await QQ.restoreSession();
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('challengesContainer').style.display = 'block';
  renderChallenges();
  PageLoader.hide();
  const params = new URLSearchParams(window.location.search);
  const lvl = params.get('level');
  if (lvl) setTimeout(() => document.getElementById('tier-'+lvl)?.scrollIntoView({behavior:'smooth',block:'start'}), 300);
});

let activeFilter = 0;
function filterTier(tier, btn) {
  activeFilter = tier;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChallenges();
}

function renderChallenges() {
  const container = document.getElementById('challengesContainer');
  container.innerHTML = '';
  const user     = QQ.getUser();
  const userXP   = user ? (user.xp || 0) : 0;
  const progress = QQ.getProgress();
  const tiers    = activeFilter === 0 ? TIERS : TIERS.filter(t => t.id === activeFilter);

  // FIX 4: check if ALL challenges in previous tier are solved
  function prevTierComplete(tierIndex) {
    if (tierIndex === 0) return true; // Rookie always unlocked
    const prevTier = TIERS[tierIndex - 1];
    const prevChallenges = CHALLENGES_DATA.filter(c => c.tier === prevTier.id);
    return prevChallenges.every(c => progress[c.id]?.solved);
  }

  tiers.forEach(tier => {
    const tierIndex      = TIERS.findIndex(t => t.id === tier.id);
    const tierChallenges = CHALLENGES_DATA.filter(c => c.tier === tier.id);
    const tierSolved     = tierChallenges.filter(c => progress[c.id]?.solved).length;

    // FIX 4: Tier unlocks only when user has enough XP AND all prev tier challenges done
    const hasXP          = userXP >= tier.minXP;
    const prevComplete   = prevTierComplete(tierIndex);
    const isUnlocked     = hasXP && prevComplete;

    const sec = document.createElement('div');
    sec.className = 'tier-section'; sec.id = 'tier-' + tier.id;

    // Tier header
    let lockReason = '';
    if (!hasXP)        lockReason = `Need ${tier.minXP} XP (you have ${userXP})`;
    else if (!prevComplete) lockReason = `Complete all ${TIERS[tierIndex-1]?.name} challenges first`;

    sec.innerHTML = `<div class="tier-header">
      <div class="tier-icon-lg">${isUnlocked ? tier.icon : '🔒'}</div>
      <div>
        <div class="tier-title">${tier.name}</div>
        <div class="tier-subtitle">${tierChallenges.length} challenges · ${tier.minXP} XP required · ${tierSolved}/${tierChallenges.length} solved</div>
        ${lockReason ? `<div style="font-family:var(--font-mono);font-size:0.65rem;color:var(--danger);margin-top:3px;">🔒 ${lockReason}</div>` : ''}
      </div>
      <span class="badge badge-${tier.name.toLowerCase()}" style="margin-left:auto;">${isUnlocked ? 'Unlocked' : 'Locked'}</span>
    </div>`;

    if (!isUnlocked && user) {
      sec.innerHTML += `<div class="tier-locked-banner">🔒 ${lockReason || 'Locked'}</div>`;
    } else {
      const grid = document.createElement('div');
      grid.className = 'challenges-grid';

      tierChallenges.forEach((ch, idx) => {
        const solved = !!progress[ch.id]?.solved;

        // FIX 4: sequential lock within tier
        // ch[0] always available; ch[N] locked if ch[N-1] not solved (unless ch[N] already solved)
        const seqLocked = idx > 0 && !progress[tierChallenges[idx-1].id]?.solved && !solved;

        const a = document.createElement(seqLocked ? 'div' : 'a');
        if (!seqLocked) a.href = 'challenge.html?id=' + ch.id;
        a.className = 'challenge-card' + (solved ? ' solved' : '') + (seqLocked ? ' ch-locked' : '');

        const statusLine = solved
          ? ''
          : seqLocked
            ? `<div class="ch-lock-label">🔒 Complete "${tierChallenges[idx-1].title}" first</div>`
            : idx === 0 ? `<div class="ch-lock-label" style="color:var(--accent);">▶ Start here</div>` : '';

        a.innerHTML = `
          <div class="ch-tier"><span class="badge badge-${ch.tierName.toLowerCase()}">${ch.tierName}</span></div>
          <div class="ch-title">${seqLocked ? '🔒 ' : ''}${ch.title}</div>
          <div class="ch-desc">${ch.description}</div>
          <div class="ch-footer">
            <div class="ch-concepts">${ch.concepts.slice(0,3).map(c=>`<span>${c}</span>`).join('')}</div>
            <div class="ch-xp">+${ch.xp} XP</div>
          </div>
          ${statusLine}`;

        if (seqLocked) {
          a.addEventListener('click', () =>
            alert(`Complete "${tierChallenges[idx-1].title}" first to unlock this challenge.`)
          );
        }
        grid.appendChild(a);
      });
      sec.appendChild(grid);
    }
    container.appendChild(sec);
  });
}
</script>
</body>
</html>

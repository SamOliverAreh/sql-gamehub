<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:80px 16px 40px; }
    .auth-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:40px 32px; width:100%; max-width:420px; position:relative; z-index:1; box-shadow:var(--shadow); }
    .auth-logo { font-family:var(--font-display); color:var(--accent); font-size:0.85rem; letter-spacing:0.15em; margin-bottom:28px; }
    .auth-title { font-size:1.5rem; margin-bottom:6px; }
    .auth-sub { color:var(--text-muted); font-size:0.84rem; margin-bottom:28px; }
    .auth-switch { text-align:center; margin-top:20px; color:var(--text-muted); font-size:0.84rem; }
    .auth-switch a { color:var(--accent); text-decoration:none; }
    @media(max-width:480px){ .auth-card { padding:28px 18px; } }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>
<nav class="navbar"></nav>
<div class="nav-mobile-menu" id="navMobileMenu"></div>

<div class="auth-card">
  <div class="auth-logo">⬡ QUERYQUEST</div>
  <h1 class="auth-title">Welcome Back</h1>
  <p class="auth-sub">Sign in to continue your SQL journey.</p>
  <div id="alertBox"></div>
  <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="your_handle"/></div>
  <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••"/></div>
  <button class="btn-primary" style="width:100%;justify-content:center;padding:13px;" onclick="handleLogin()">Login →</button>
  <div class="auth-switch">Don't have an account? <a href="register.html">Register here</a></div>
</div>

<script src="../js/main.js"></script>
<script src="../js/nav-inject.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  buildNav('');
  if (QQ.getUser()) window.location.href = 'dashboard.html';
});
function showAlert(msg,type='error'){document.getElementById('alertBox').innerHTML=`<div class="alert alert-${type}">${msg}</div>`;}
function handleLogin(){
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  if(!u||!p)return showAlert('Please fill in all fields.');
  const users=JSON.parse(localStorage.getItem('qq_users')||'[]');
  const user=users.find(x=>x.username.toLowerCase()===u.toLowerCase()&&x.password===p);
  if(!user)return showAlert('Invalid username or password.');
  QQ.setUser(user);
  showAlert('Login successful! Redirecting...','success');
  setTimeout(()=>window.location.href='dashboard.html',1000);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:80px 16px 40px; }
    .auth-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:40px 32px; width:100%; max-width:420px; position:relative; z-index:1; box-shadow:var(--shadow); }
    .auth-logo { font-family:var(--font-display); color:var(--accent); font-size:0.85rem; letter-spacing:0.15em; margin-bottom:28px; }
    .auth-title { font-size:1.5rem; margin-bottom:6px; }
    .auth-sub { color:var(--text-muted); font-size:0.84rem; margin-bottom:28px; }
    .auth-switch { text-align:center; margin-top:20px; color:var(--text-muted); font-size:0.84rem; }
    .auth-switch a { color:var(--accent); text-decoration:none; }
    .btn-loading { opacity:0.7; pointer-events:none; }
    @media(max-width:480px){ .auth-card { padding:28px 18px; } }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>
<nav class="navbar"></nav>
<div class="nav-mobile-menu" id="navMobileMenu"></div>

<div class="auth-card">
  <div class="auth-logo">⬡ QUERYQUEST</div>
  <h1 class="auth-title">Welcome Back</h1>
  <p class="auth-sub">Sign in to continue your SQL journey.</p>
  <div id="alertBox"></div>
  <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="your_handle"/></div>
  <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••"/></div>
  <button class="btn-primary" id="loginBtn" style="width:100%;justify-content:center;padding:13px;" onclick="handleLogin()">Login →</button>
  <div class="auth-switch">Don't have an account? <a href="register.html">Register here</a></div>

  <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:center;">
    <p style="font-family:var(--font-mono);font-size:0.72rem;color:var(--text-dim);margin-bottom:12px;">JUST EXPLORING?</p>
    <button onclick="playAsGuest()" class="btn-ghost" style="width:100%;justify-content:center;gap:8px;">
      👤 Play as Guest
    </button>
    <p style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);margin-top:8px;line-height:1.6;">
      Full access, no account needed. Progress lost on tab close.
    </p>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/nav-inject.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  buildNav('');
  // If already has valid token, restore and redirect
  const token = localStorage.getItem('qq_token');
  if (token) {
    QQ.restoreSession().then(user => {
      if (user) window.location.href = 'dashboard.html';
    });
  }
});
function showAlert(msg, type='error') {
  document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}
async function handleLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) return showAlert('Please fill in all fields.');
  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Logging in...'; btn.classList.add('btn-loading');
  const r = await QQ.login(username, password);
  btn.textContent = 'Login →'; btn.classList.remove('btn-loading');
  if (!r.ok) return showAlert(r.error || 'Login failed.');
  showAlert('Login successful! Redirecting...', 'success');
  setTimeout(() => window.location.href = 'dashboard.html', 800);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

function playAsGuest() {
  if (!confirm(
    '⚠️ Guest Mode Notice\n\n' +
    '• Full access to all challenges and adventures\n' +
    '• XP, tier unlocks and progress work normally\n' +
    '• Your progress is NOT saved to any database\n' +
    '• Progress will be lost when you close this tab\n\n' +
    'No personal data is collected in guest mode.\n\n' +
    'Continue as guest?'
  )) return;
  const user = QQ.startAnonymous();
  showAlert('Welcome, ' + user.username + '! Playing as guest.', 'success');
  setTimeout(() => window.location.href = 'challenges.html', 1000);
}
</script>
</body>
</html>

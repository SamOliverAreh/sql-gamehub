<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 100px 20px 40px; }
    .auth-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      padding: 48px; width: 100%; max-width: 420px;
      position: relative; z-index: 1;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    }
    .auth-logo { font-family: var(--font-display); color: var(--accent); font-size: 0.9rem; letter-spacing: 0.15em; margin-bottom: 32px; }
    .auth-title { font-size: 1.6rem; margin-bottom: 8px; }
    .auth-sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 32px; }
    .auth-switch { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 0.85rem; }
    .auth-switch a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanline"></div>

  <nav class="navbar">
    <a href="../index.html" class="nav-logo"><span class="logo-icon">⬡</span><span class="logo-text">QueryQuest</span></a>
    <div class="nav-auth">
      <a href="register.html" class="btn-primary">Register</a>
    </div>
  </nav>

  <div class="auth-card">
    <div class="auth-logo">⬡ QUERYQUEST</div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Sign in to continue your SQL journey.</p>

    <div id="alertBox"></div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="your_handle"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"/>
    </div>

    <button class="btn-primary" style="width:100%;justify-content:center;padding:14px;" onclick="handleLogin()">
      Login →
    </button>

    <div class="auth-switch">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    if (QQ.getUser()) window.location.href = 'dashboard.html';

    function showAlert(msg, type='error') {
      document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return showAlert('Please fill in all fields.');

      const users = JSON.parse(localStorage.getItem('qq_users') || '[]');
      const user = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
      if (!user) return showAlert('Invalid username or password.');

      QQ.setUser(user);
      showAlert('Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>

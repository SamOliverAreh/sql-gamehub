<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Challenge — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
  <style>
    body { padding-top: 70px; }
    .challenge-layout { max-width: 1200px; margin: 0 auto; padding: 32px 16px; display: grid; grid-template-columns: 360px 1fr; gap: 20px; position: relative; z-index: 1; }
    .left-panel {}
    .info-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px 20px; margin-bottom: 14px; }
    .ch-nav { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); margin-bottom: 16px; }
    .ch-nav a { color: var(--text-muted); text-decoration: none; } .ch-nav a:hover { color: var(--accent); }
    .ch-title { font-size: 1.2rem; margin-bottom: 10px; }
    .ch-desc { font-size: 0.84rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }
    .ch-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .concept-pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .concept-pills span { font-family: var(--font-mono); font-size: 0.6rem; padding: 2px 8px; border-radius: 4px; background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.18); color: var(--accent); }
    .xp-pill { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--accent3); font-family: var(--font-mono); font-size: 0.7rem; padding: 3px 10px; border-radius: 99px; }
    .hint-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
    .hint-toggle { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: none; border: none; width: 100%; padding: 0; }
    .hint-body { margin-top: 10px; font-size: 0.82rem; color: var(--text-muted); display: none; line-height: 1.6; }
    .hint-body.show { display: block; }
    .schema-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
    .schema-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 8px; }
    .schema-code { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); background: var(--bg-secondary); padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre; line-height: 1.7; border: 1px solid var(--border); }
    .right-panel { display: flex; flex-direction: column; gap: 14px; }
    .editor-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .editor-topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
    .editor-label { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); }
    .editor-btns { display: flex; gap: 6px; }
    .CodeMirror { height: 220px !important; font-size: 0.86rem !important; background: var(--bg-card) !important; }
    .run-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg-secondary); flex-wrap: wrap; gap: 8px; }
    .run-hint { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); }
    .results-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .results-topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
    .results-label { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); }
    .exec-time { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); }
    .results-body { padding: 14px; min-height: 140px; overflow-x: auto; }
    .results-placeholder { display: flex; align-items: center; justify-content: center; height: 110px; color: var(--text-dim); font-family: var(--font-mono); font-size: 0.8rem; }
    .error-out { color: var(--danger); font-family: var(--font-mono); font-size: 0.8rem; padding: 10px; background: rgba(239,68,68,0.08); border-radius: 8px; }
    .nav-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .nav-pair { display: flex; gap: 8px; }
    .success-overlay { display: none; position: fixed; inset: 0; background: var(--modal-bg); backdrop-filter: blur(8px); z-index: 300; align-items: center; justify-content: center; padding: 16px; }
    .success-overlay.show { display: flex; }
    /* FIX 2: validation overlay */
    .validating-overlay { display:none; position:fixed; inset:0; background:rgba(5,8,16,0.82); backdrop-filter:blur(4px); z-index:400; align-items:center; justify-content:center; flex-direction:column; gap:18px; }
    .validating-overlay.show { display:flex; }
    .val-spinner { width:48px; height:48px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .val-title { font-family:var(--font-display); font-size:1rem; color:var(--accent); letter-spacing:0.1em; }
    .val-sub { font-family:var(--font-mono); font-size:0.78rem; color:var(--text-muted); }
    .val-bar-bg { width:220px; height:4px; background:var(--border); border-radius:99px; overflow:hidden; }
    .val-bar-fill { height:100%; background:var(--accent); border-radius:99px; animation:valProgress 2.5s ease forwards; }
    @keyframes valProgress { from{width:0%} to{width:100%} }
    .success-card { background: var(--bg-card); border: 1px solid var(--accent3); border-radius: 20px; padding: 40px 28px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 0 60px rgba(16,185,129,0.2); animation: fadeInUp 0.3s ease; }
    .success-icon { font-size: 3rem; margin-bottom: 12px; }
    .success-title { font-family: var(--font-display); font-size: 1.3rem; color: var(--accent3); margin-bottom: 8px; }
    .success-xp { font-family: var(--font-display); font-size: 2rem; color: var(--accent); margin: 12px 0; }
    .success-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    @media (max-width: 900px) { .challenge-layout { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .CodeMirror { height: 170px !important; } .success-card { padding: 28px 16px; } }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>
<nav class="navbar"></nav>
<div class="nav-mobile-menu" id="navMobileMenu"></div>

<div class="challenge-layout">
  <div class="left-panel">
    <div class="info-card">
      <div class="ch-nav"><a href="challenges.html">Challenges</a> / <span id="chTierNav">...</span></div>
      <div id="chTierBadge" style="margin-bottom:10px;"></div>
      <h1 class="ch-title" id="chTitle">Loading...</h1>
      <p class="ch-desc" id="chDesc"></p>
      <div class="ch-meta">
        <span class="xp-pill" id="chXP"></span>
        <span id="solvedBadge"></span>
      </div>
      <div class="concept-pills" id="chConcepts"></div>
    </div>
    <div class="hint-card">
      <button class="hint-toggle" onclick="toggleHint()">💡 Show Hint <span id="hintArrow">▼</span></button>
      <div class="hint-body" id="hintBody"></div>
    </div>
    <div class="schema-card">
      <div class="schema-label">Database Schema</div>
      <div class="schema-code" id="schemaDisplay"></div>
    </div>
  </div>

  <div class="right-panel">
    <div class="editor-card">
      <div class="editor-topbar">
        <span class="editor-label">📝 SQL Editor</span>
        <div class="editor-btns">
          <button class="btn-ghost btn-sm" onclick="clearEditor()">Clear</button>
          <button class="btn-ghost btn-sm" onclick="showSolution()">Solution</button>
        </div>
      </div>
      <textarea id="sqlEditor">-- Write your SQL query here
SELECT </textarea>
      <div class="run-bar">
        <span class="run-hint">Ctrl+Enter to run</span>
        <button class="btn-run" onclick="runQuery()">▶ Run Query</button>
      </div>
    </div>

    <div class="results-card">
      <div class="results-topbar">
        <span class="results-label" id="resultsLabel">RESULTS</span>
        <span class="exec-time" id="execTime"></span>
      </div>
      <div class="results-body" id="resultsBody">
        <div class="results-placeholder">Run your query to see results here.</div>
      </div>
    </div>

    <div class="nav-row">
      <a href="challenges.html" class="btn-ghost btn-sm">← All Challenges</a>
      <div class="nav-pair">
        <button class="btn-ghost btn-sm" id="prevBtn" onclick="navigate(-1)">← Prev</button>
        <button class="btn-ghost btn-sm" id="nextBtn" onclick="navigate(1)">Next →</button>
      </div>
    </div>
  </div>
</div>

<!-- FIX 2: Validation overlay — blocks UI during async save -->
<div class="validating-overlay" id="validatingOverlay">
  <div class="val-spinner"></div>
  <div class="val-title">Validating Query...</div>
  <div class="val-sub">Saving your progress to the server</div>
  <div class="val-bar-bg"><div class="val-bar-fill" id="valBarFill"></div></div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-icon">🎉</div>
    <div class="success-title">Challenge Complete!</div>
    <div class="success-xp" id="successXP">+0 XP</div>
    <p style="color:var(--text-muted);font-size:0.86rem;" id="successMsg"></p>
    <div class="success-actions">
      <button class="btn-ghost" onclick="closeSuccess()">Stay Here</button>
      <button class="btn-primary" onclick="nextChallenge()">Next →</button>
      <a href="challenges.html" class="btn-ghost">All</a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script src="../js/page-loader.js"></script>
<script src="../js/main.js"></script>
<script src="../js/nav-inject.js"></script>
<script src="../data/challenges.js"></script>
<script>
let db=null, sqlJS=null, currentChallenge=null;
const editor = CodeMirror.fromTextArea(document.getElementById('sqlEditor'),{mode:'text/x-sql',theme:'default',lineNumbers:true,extraKeys:{'Ctrl-Enter':runQuery,'Cmd-Enter':runQuery}});
const params = new URLSearchParams(window.location.search);
currentChallenge = CHALLENGES_DATA.find(c=>c.id===params.get('id')) || CHALLENGES_DATA[0];

document.addEventListener('DOMContentLoaded', async () => {
  // FIX 4: require auth or guest session
  const token  = localStorage.getItem('qq_token');
  const isAnon = QQ.isAnonymous();
  if (!token && !isAnon) { window.location.href = 'register.html'; return; }
  PageLoader.show('Loading Challenge', 'Preparing the database...');
  buildNav('challenges');
  await QQ.restoreSession();
  loadChallenge(currentChallenge);
  PageLoader.hide();
});

function loadChallenge(ch) {
  currentChallenge = ch;
  document.title = ch.title + ' — QueryQuest';
  document.getElementById('chTierNav').textContent = ch.tierName;
  document.getElementById('chTierBadge').innerHTML = `<span class="badge badge-${ch.tierName.toLowerCase()}">${ch.tierName}</span>`;
  document.getElementById('chTitle').textContent = ch.title;
  document.getElementById('chDesc').textContent = ch.description;
  document.getElementById('chXP').textContent = '+' + ch.xp + ' XP';
  document.getElementById('hintBody').textContent = ch.hint;
  document.getElementById('hintBody').classList.remove('show');
  document.getElementById('hintArrow').textContent = '▼';
  document.getElementById('schemaDisplay').textContent = ch.schema.trim();
  document.getElementById('chConcepts').innerHTML = ch.concepts.map(c=>`<span>${c}</span>`).join('');
  document.getElementById('solvedBadge').innerHTML = QQ.isSolved(ch.id) ? '<span class="badge badge-rookie">✓ Solved</span>' : '';
  const idx = CHALLENGES_DATA.indexOf(ch);
  document.getElementById('prevBtn').disabled = idx === 0;
  // FIX 1: Next locked unless current challenge is solved
  const nextCh = CHALLENGES_DATA[idx + 1];
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = idx === CHALLENGES_DATA.length - 1;
  if (nextCh && !QQ.isSolved(ch.id)) {
    nextBtn.disabled = true;
    nextBtn.title = 'Solve this challenge first to unlock the next one';
    nextBtn.style.opacity = '0.4';
    nextBtn.style.cursor = 'not-allowed';
  } else {
    nextBtn.title = '';
    nextBtn.style.opacity = '';
    nextBtn.style.cursor = '';
  }
  document.getElementById('resultsBody').innerHTML = '<div class="results-placeholder">Run your query to see results here.</div>';
  document.getElementById('execTime').textContent = '';
  document.getElementById('resultsLabel').textContent = 'RESULTS';
  initDB(ch);
}

async function initDB(ch) {
  try {
    if (!sqlJS) sqlJS = await initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`});
    db = new sqlJS.Database();
    db.run(ch.schema); db.run(ch.seed);
  } catch(e){console.error(e);}
}

function runQuery() {
  if (!db) { showError('Database loading, please wait...'); return; }
  const q = editor.getValue().trim(); if (!q) return;
  const t = Date.now();
  try {
    const res = db.exec(q);
    document.getElementById('execTime').textContent = (Date.now()-t)+'ms';
    if (!res.length) { document.getElementById('resultsBody').innerHTML='<div class="results-placeholder" style="color:var(--accent3)">✓ Executed. No rows returned.</div>'; return; }
    const {columns,values} = res[0];
    renderTable(columns,values);
    const rows = values.map(row=>{const o={};columns.forEach((c,i)=>o[c]=row[i]);return o;});
    if (currentChallenge.validate(rows,columns)) handleSuccess();
  } catch(e){showError(e.message);}
}

function renderTable(cols,vals) {
  let h='<div style="overflow-x:auto"><table class="result-table"><thead><tr>';
  cols.forEach(c=>h+=`<th>${c}</th>`); h+='</tr></thead><tbody>';
  vals.forEach(r=>{h+='<tr>';r.forEach(v=>h+=`<td>${v===null?'<em style="color:var(--text-dim)">NULL</em>':v}</td>`);h+='</tr>';});
  h+=`</tbody></table></div><div style="font-family:var(--font-mono);font-size:0.68rem;color:var(--text-dim);margin-top:6px;">${vals.length} row${vals.length!==1?'s':''} returned</div>`;
  document.getElementById('resultsLabel').textContent='✓ RESULTS';
  document.getElementById('resultsBody').innerHTML=h;
}
function showError(msg){document.getElementById('resultsLabel').textContent='✗ ERROR';document.getElementById('resultsBody').innerHTML=`<div class="error-out">⚠ ${msg}</div>`;}
async function handleSuccess(){
  // FIX 2: show validating overlay, block all interaction
  const valOverlay = document.getElementById('validatingOverlay');
  valOverlay.classList.add('show');
  // Reset progress bar animation by cloning
  const oldBar = document.getElementById('valBarFill');
  const newBar = oldBar.cloneNode(true);
  oldBar.parentNode.replaceChild(newBar, oldBar);

  // Server is source of truth
  const result    = await QQ.saveProgress(currentChallenge.id);
  const firstTime = result && result.ok && !result.alreadySolved;

  if (firstTime) {
    await QQ.addXP(currentChallenge.xp);
    document.getElementById('solvedBadge').innerHTML = '<span class="badge badge-rookie">✓ Solved</span>';
  }

  // Small delay so progress bar completes visually before swap
  await new Promise(r => setTimeout(r, 400));

  // Hide validating, show success
  valOverlay.classList.remove('show');
  document.getElementById('successXP').textContent  = firstTime ? '+' + currentChallenge.xp + ' XP earned! 🎉' : 'Already completed ✓';
  const baseMsg = firstTime ? 'Correct! ' + currentChallenge.expectedNote : 'You already solved this one. No extra XP, but great practice!';
  const anonMsg = QQ.isAnonymous() ? '<br><br>👤 <strong>Guest mode:</strong> <a href="register.html" style="color:var(--accent);">Register free</a> to save your progress!' : '';
  document.getElementById('successMsg').innerHTML = baseMsg + anonMsg;
  document.getElementById('successOverlay').classList.add('show');
}
function closeSuccess(){document.getElementById('successOverlay').classList.remove('show');}
function nextChallenge(){closeSuccess();navigate(1);}
function navigate(dir){
  const idx = CHALLENGES_DATA.indexOf(currentChallenge);
  const n   = CHALLENGES_DATA[idx + dir];
  if (!n) return;
  // FIX 1: going forward requires current to be solved
  if (dir > 0 && !QQ.isSolved(currentChallenge.id)) {
    alert('Complete this challenge first before moving to the next one.');
    return;
  }
  // FIX 1: going forward also requires previous sequential lock satisfied
  const nIdx = CHALLENGES_DATA.indexOf(n);
  const sameTier = n.tier === currentChallenge.tier;
  if (dir > 0 && sameTier) {
    // Already checked above
  } else if (dir > 0 && !sameTier) {
    // Moving to next tier — check tier lock
    const progress = QQ.getProgress();
    const prevTierChs = CHALLENGES_DATA.filter(c => c.tier === currentChallenge.tier);
    const allDone = prevTierChs.every(c => progress[c.id]?.solved);
    if (!allDone) {
      alert('Complete all challenges in the ' + currentChallenge.tierName + ' tier first.');
      return;
    }
  }
  window.location.href = 'challenge.html?id=' + n.id;
}
function toggleHint(){const b=document.getElementById('hintBody');b.classList.toggle('show');document.getElementById('hintArrow').textContent=b.classList.contains('show')?'▲':'▼';}
function clearEditor(){editor.setValue('-- Write your SQL query here\nSELECT ');editor.focus();}
function showSolution(){if(confirm('Show the solution? This will replace your current query.'))editor.setValue(currentChallenge.solutionQuery.trim());}
</script>
</body>
</html>

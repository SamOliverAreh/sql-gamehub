<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:80px 16px 40px; }
    .auth-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:40px 32px; width:100%; max-width:440px; position:relative; z-index:1; box-shadow:var(--shadow); }
    .auth-logo { font-family:var(--font-display); color:var(--accent); font-size:0.85rem; letter-spacing:0.15em; margin-bottom:28px; }
    .auth-title { font-size:1.5rem; margin-bottom:6px; }
    .auth-sub { color:var(--text-muted); font-size:0.84rem; margin-bottom:24px; }
    .auth-switch { text-align:center; margin-top:20px; color:var(--text-muted); font-size:0.84rem; }
    .auth-switch a { color:var(--accent); text-decoration:none; }
    .perks { display:flex; gap:8px; margin-bottom:22px; }
    .perk { flex:1; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; padding:10px 6px; text-align:center; }
    .perk-icon { font-size:1.1rem; }
    .perk-label { font-family:var(--font-mono); font-size:0.6rem; color:var(--text-muted); margin-top:4px; }
    .btn-loading { opacity:0.7; pointer-events:none; }
    @media(max-width:480px){ .auth-card { padding:28px 18px; } }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>
<nav class="navbar"></nav>
<div class="nav-mobile-menu" id="navMobileMenu"></div>

<div class="auth-card">
  <div class="auth-logo">⬡ QUERYQUEST</div>
  <h1 class="auth-title">Create Account</h1>
  <p class="auth-sub">Join the SQL arena. Earn XP. Prove your skills.</p>
  <div class="perks">
    <div class="perk"><div class="perk-icon">🎯</div><div class="perk-label">42 Challenges</div></div>
    <div class="perk"><div class="perk-icon">🗺️</div><div class="perk-label">3 Adventures</div></div>
    <div class="perk"><div class="perk-icon">🏆</div><div class="perk-label">Leaderboard</div></div>
  </div>
  <div id="alertBox"></div>
  <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="your_handle" maxlength="20"/></div>
  <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com"/></div>
  <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="min 6 characters"/></div>
  <div class="form-group"><label>Confirm Password</label><input type="password" id="confirm" placeholder="repeat password"/></div>
  <button class="btn-primary" id="regBtn" style="width:100%;justify-content:center;padding:13px;" onclick="handleRegister()">Create Account →</button>
  <div class="auth-switch">Already have an account? <a href="login.html">Login here</a></div>

  <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:center;">
    <p style="font-family:var(--font-mono);font-size:0.72rem;color:var(--text-dim);margin-bottom:12px;">NOT READY TO REGISTER?</p>
    <button onclick="playAsGuest()" class="btn-ghost" style="width:100%;justify-content:center;gap:8px;">
      👤 Play as Guest
    </button>
    <p style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);margin-top:8px;line-height:1.6;">
      Full access to all challenges &amp; adventures. Progress not saved when you close the tab.
    </p>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/nav-inject.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  buildNav('');
  const token = localStorage.getItem('qq_token');
  if (token) {
    QQ.restoreSession().then(u => { if (u) window.location.href = 'dashboard.html'; });
  }
});
function showAlert(msg, type='error') {
  document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}
async function handleRegister() {
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  if (!username || !email || !password) return showAlert('All fields are required.');
  if (username.length < 3) return showAlert('Username must be at least 3 characters.');
  if (!/^[a-zA-Z0-9_]+$/.test(username)) return showAlert('Username: letters, numbers, underscores only.');
  if (password.length < 6) return showAlert('Password must be at least 6 characters.');
  if (password !== confirm) return showAlert('Passwords do not match.');
  if (!/\S+@\S+\.\S+/.test(email)) return showAlert('Please enter a valid email.');
  const btn = document.getElementById('regBtn');
  btn.textContent = 'Creating account...'; btn.classList.add('btn-loading');
  const r = await QQ.register(username, email, password);
  btn.textContent = 'Create Account →'; btn.classList.remove('btn-loading');
  if (!r.ok) return showAlert(r.error || 'Registration failed.');
  showAlert('Account created! Redirecting...', 'success');
  setTimeout(() => window.location.href = 'dashboard.html', 800);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });

function playAsGuest() {
  if (!confirm(
    '⚠️ Guest Mode Notice\n\n' +
    '• Full access to all challenges and adventures\n' +
    '• XP, tier unlocks and progress work normally\n' +
    '• Your progress is NOT saved to any database\n' +
    '• Progress will be lost when you close this tab\n\n' +
    'No personal data is collected in guest mode.\n\n' +
    'Continue as guest?'
  )) return;
  const user = QQ.startAnonymous();
  showAlert('Welcome, ' + user.username + '! Playing as guest.', 'success');
  setTimeout(() => window.location.href = 'challenges.html', 1000);
}
</script>
</body>
</html>

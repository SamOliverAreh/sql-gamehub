<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 100px 20px 40px; }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px;
      width: 100%; max-width: 440px;
      position: relative; z-index: 1;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    }
    .auth-logo { font-family: var(--font-display); color: var(--accent); font-size: 0.9rem; letter-spacing: 0.15em; margin-bottom: 32px; }
    .auth-title { font-size: 1.6rem; margin-bottom: 8px; }
    .auth-sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 32px; }
    .auth-switch { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 0.85rem; }
    .auth-switch a { color: var(--accent); text-decoration: none; }
    .xp-preview { display: flex; gap: 12px; margin-bottom: 28px; }
    .xp-item { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .xp-icon { font-size: 1.3rem; }
    .xp-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; }
    .divider { height: 1px; background: var(--border); margin: 28px 0; }
    .social-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; text-decoration: none; transition: var(--transition); margin-bottom: 12px; }
    .social-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanline"></div>

  <nav class="navbar">
    <a href="../index.html" class="nav-logo"><span class="logo-icon">⬡</span><span class="logo-text">QueryQuest</span></a>
    <div class="nav-auth">
      <a href="login.html" class="btn-ghost">Login</a>
    </div>
  </nav>

  <div class="auth-card">
    <div class="auth-logo">⬡ QUERYQUEST</div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Join the SQL arena. Earn XP. Prove your skills.</p>

    <div class="xp-preview">
      <div class="xp-item"><div class="xp-icon">🎯</div><div class="xp-label">42 Challenges</div></div>
      <div class="xp-item"><div class="xp-icon">🏆</div><div class="xp-label">Leaderboard</div></div>
      <div class="xp-item"><div class="xp-icon">⚡</div><div class="xp-label">Earn XP</div></div>
    </div>

    <div id="alertBox"></div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="your_handle" maxlength="20"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="min 6 characters"/>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm" placeholder="repeat password"/>
    </div>

    <button class="btn-primary" style="width:100%;justify-content:center;padding:14px;" onclick="handleRegister()">
      Create Account →
    </button>

    <div class="auth-switch">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    // Check if already logged in
    if (QQ.getUser()) window.location.href = 'dashboard.html';

    function showAlert(msg, type='error') {
      document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    function handleRegister() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (!username || !email || !password) return showAlert('All fields are required.');
      if (username.length < 3) return showAlert('Username must be at least 3 characters.');
      if (!/^[a-zA-Z0-9_]+$/.test(username)) return showAlert('Username can only contain letters, numbers, and underscores.');
      if (password.length < 6) return showAlert('Password must be at least 6 characters.');
      if (password !== confirm) return showAlert('Passwords do not match.');
      if (!/\S+@\S+\.\S+/.test(email)) return showAlert('Please enter a valid email.');

      // Check if username taken (from local "db")
      const users = JSON.parse(localStorage.getItem('qq_users') || '[]');
      if (users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
        return showAlert('Username already taken. Try another.');
      }
      if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
        return showAlert('Email already registered.');
      }

      const newUser = {
        id: Date.now(),
        username,
        email,
        password, // NOTE: In prod, NEVER store plaintext. Use bcrypt on a real backend.
        xp: 0,
        level: 'Rookie',
        joinedAt: new Date().toISOString(),
        solvedIds: []
      };
      users.push(newUser);
      localStorage.setItem('qq_users', JSON.stringify(users));

      // Log them in
      QQ.setUser(newUser);
      QQ.updateLeaderboard(newUser);

      showAlert('Account created! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1200);
    }

    // Enter key support
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { padding-top: 70px; }
    .dash-wrap { max-width: 1000px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }
    .dash-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 36px; flex-wrap: wrap; }
    .dash-welcome h1 { font-size: clamp(1.3rem,4vw,1.8rem); }
    .dash-welcome p { color: var(--text-muted); margin-top: 4px; font-size: 0.86rem; }
    .tier-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .tier-row.active { border-color: var(--accent); background: rgba(0,212,255,0.04); }
    .tier-icon { font-size: 1.4rem; min-width: 32px; text-align: center; }
    .tier-info { flex: 1; min-width: 120px; }
    .tier-name { font-family: var(--font-display); font-size: 0.82rem; }
    .tier-meta { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }
    .tier-status { font-family: var(--font-mono); font-size: 0.7rem; white-space: nowrap; }
    .tier-status.unlocked { color: var(--accent3); }
    .tier-status.locked-dim { color: var(--text-dim); }
    .recent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .recent-header h2 { font-size: 1rem; }
    .recent-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .recent-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
    .recent-item:last-child { border-bottom: none; }
    .recent-title { font-size: 0.86rem; }
    .recent-meta { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }
    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
    .empty-state p { margin-bottom: 16px; font-size: 0.88rem; }
    .section-gap { margin-bottom: 40px; }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>
<nav class="navbar"></nav>
<div class="nav-mobile-menu" id="navMobileMenu"></div>

<div class="dash-wrap">
  <div class="dash-header">
    <div class="dash-welcome">
      <h1>Welcome back, <span class="accent" id="dashUsername"></span></h1>
      <p id="dashMeta">Loading...</p>
    </div>
    <a href="challenges.html" class="btn-primary">Continue →</a>
  </div>

  <div class="xp-bar-wrap">
    <div class="xp-bar-label"><span id="xpLabel">0 XP</span><span id="xpNextLabel"></span></div>
    <div class="xp-bar-bg"><div class="xp-bar-fill" id="xpFill" style="width:0%"></div></div>
  </div>

  <div class="stat-cards section-gap">
    <div class="stat-card"><div class="stat-card-num" id="sXP">0</div><div class="stat-card-label">Total XP</div></div>
    <div class="stat-card"><div class="stat-card-num" id="sSolved">0</div><div class="stat-card-label">Challenges Solved</div></div>
    <div class="stat-card"><div class="stat-card-num" id="sRank">#—</div><div class="stat-card-label">Leaderboard Rank</div></div>
    <div class="stat-card"><div class="stat-card-num" id="sTier">🌱</div><div class="stat-card-label">Current Tier</div></div>
  </div>

  <h2 style="font-size:1rem;margin-bottom:14px;" class="section-gap">Tier Progress</h2>
  <div id="tierProgress" class="section-gap"></div>

  <div class="recent-header"><h2>Recent Solves</h2><a href="challenges.html" style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);text-decoration:none;">All challenges →</a></div>
  <div class="recent-list" id="recentList"></div>
</div>

<script src="../js/main.js"></script>
<script src="../js/nav-inject.js"></script>
<script src="../data/challenges.js"></script>
<script src="../data/adventure-data.js"></script>
<script>
const user = QQ.getUser();
if (!user) window.location.href = 'login.html';

document.addEventListener('DOMContentLoaded', () => {
  buildNav('dashboard');
  render();
});

function render() {
  document.getElementById('dashUsername').textContent = user.username;
  document.getElementById('dashMeta').textContent = `Tier: ${user.level||'Rookie'} · Joined ${new Date(user.joinedAt).toLocaleDateString()}`;
  const xp = user.xp || 0;
  const progress = QQ.getProgress();
  const solved = Object.values(progress).filter(p=>p.solved).length;
  document.getElementById('sXP').textContent = xp;
  document.getElementById('sSolved').textContent = solved;
  const board = JSON.parse(localStorage.getItem('qq_leaderboard')||'[]');
  const rank = board.findIndex(e=>e.username===user.username)+1;
  document.getElementById('sRank').textContent = rank>0?'#'+rank:'#—';
  const tierObj = TIERS.find(t=>t.name===(user.level||'Rookie'))||TIERS[0];
  document.getElementById('sTier').textContent = tierObj.icon;

  // XP bar
  const tidx = TIERS.findIndex(t=>t.name===(user.level||'Rookie'));
  const curMin = TIERS[tidx]?.minXP||0;
  const nextT = TIERS[tidx+1];
  const pct = nextT ? Math.min(((xp-curMin)/(nextT.minXP-curMin))*100,100) : 100;
  document.getElementById('xpFill').style.width = pct+'%';
  document.getElementById('xpLabel').textContent = xp+' XP';
  document.getElementById('xpNextLabel').textContent = nextT ? `Next: ${nextT.name} (${nextT.minXP} XP)` : '🏆 Max tier reached!';

  // Tier rows
  const tp = document.getElementById('tierProgress');
  TIERS.forEach(tier => {
    const tc = CHALLENGES_DATA.filter(c=>c.tierName===tier.name);
    const ts = tc.filter(c=>progress[c.id]?.solved).length;
    const active = tier.name===(user.level||'Rookie');
    const unlocked = xp >= tier.minXP;
    tp.innerHTML += `<div class="tier-row ${active?'active':''}">
      <div class="tier-icon">${unlocked?tier.icon:'🔒'}</div>
      <div class="tier-info"><div class="tier-name">${tier.name}</div><div class="tier-meta">${tc.length} challenges · ${tier.minXP} XP required</div></div>
      <div class="tier-status ${unlocked?'unlocked':'locked-dim'}">${unlocked?ts+'/'+tc.length+' solved':'Locked'}</div>
    </div>`;
  });

  // Recent solves
  const rl = document.getElementById('recentList');
  const recent = Object.entries(progress).filter(([,v])=>v.solved).sort((a,b)=>b[1].solvedAt-a[1].solvedAt).slice(0,6);
  if (!recent.length) {
    rl.innerHTML='<div class="empty-state"><p>No challenges solved yet.</p><a href="challenges.html" class="btn-primary">Start Now →</a></div>';
  } else {
    recent.forEach(([id])=>{
      const ch = CHALLENGES_DATA.find(c=>c.id===id);
      if (!ch) return;
      rl.innerHTML+=`<div class="recent-item"><div><div class="recent-title">${ch.title}</div><div class="recent-meta">${ch.tierName} · +${ch.xp} XP</div></div><span class="badge badge-${ch.tierName.toLowerCase()}">✓ Solved</span></div>`;
    });
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — QueryQuest</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { padding-top: 80px; }
    .dash-layout { max-width: 1100px; margin: 0 auto; padding: 48px 24px; position: relative; z-index: 1; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; flex-wrap: gap; gap: 16px; }
    .dash-welcome h1 { font-size: 1.8rem; }
    .dash-welcome p { color: var(--text-muted); margin-top: 4px; font-size: 0.9rem; }
    .xp-bar-wrap { margin-bottom: 48px; }
    .xp-bar-label { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .xp-bar-bg { height: 8px; background: var(--bg-secondary); border-radius: 99px; overflow: hidden; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; transition: width 1s ease; }
    .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 48px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .stat-card-num { font-family: var(--font-display); font-size: 2rem; color: var(--accent); }
    .stat-card-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    .tier-progress { margin-bottom: 48px; }
    .tier-row { display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
    .tier-row.active { border-color: var(--accent); background: rgba(0,212,255,0.05); }
    .tier-icon { font-size: 1.5rem; min-width: 36px; text-align: center; }
    .tier-info { flex: 1; }
    .tier-name { font-family: var(--font-display); font-size: 0.85rem; }
    .tier-challenges { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .tier-status { font-family: var(--font-mono); font-size: 0.72rem; }
    .solved-green { color: var(--accent3); }
    .locked-dim { color: var(--text-dim); }
    .recent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .recent-header h2 { font-size: 1rem; }
    .recent-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .recent-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .recent-item:last-child { border-bottom: none; }
    .recent-title { font-size: 0.88rem; }
    .recent-meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); }
    .empty-state { text-align: center; padding: 48px; color: var(--text-muted); }
    .empty-state p { margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanline"></div>

  <nav class="navbar">
    <a href="../index.html" class="nav-logo"><span>⬡</span><span class="logo-text">QueryQuest</span></a>
    <div class="nav-links">
      <a href="challenges.html">Challenges</a>
      <a href="leaderboard.html">Leaderboard</a>
    </div>
    <div class="nav-auth">
      <span class="nav-user" id="navUsername" style="font-family:var(--font-mono);font-size:0.8rem;color:var(--accent);margin-right:12px;"></span>
      <button class="btn-ghost" onclick="QQ.logout()">Logout</button>
    </div>
  </nav>

  <div class="dash-layout">
    <div class="dash-header">
      <div class="dash-welcome">
        <h1 id="welcomeTitle">Welcome back, <span class="accent" id="dashUsername"></span></h1>
        <p id="dashLevel">Loading your profile...</p>
      </div>
      <a href="challenges.html" class="btn-primary">Continue Playing →</a>
    </div>

    <!-- XP Progress Bar -->
    <div class="xp-bar-wrap">
      <div class="xp-bar-label">
        <span id="xpLabel">0 XP</span>
        <span id="xpNextLabel">Next tier: Amateur (50 XP)</span>
      </div>
      <div class="xp-bar-bg">
        <div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-card-num" id="statXP">0</div>
        <div class="stat-card-label">Total XP</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-num" id="statSolved">0</div>
        <div class="stat-card-label">Challenges Solved</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-num" id="statRank">#—</div>
        <div class="stat-card-label">Leaderboard Rank</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-num" id="statTier">🌱</div>
        <div class="stat-card-label">Current Tier</div>
      </div>
    </div>

    <!-- Tier Progress -->
    <h2 style="font-size:1rem;margin-bottom:16px;">Tier Progress</h2>
    <div class="tier-progress" id="tierProgress"></div>

    <!-- Recent Activity -->
    <div class="recent-header">
      <h2>Recent Solves</h2>
      <a href="challenges.html" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--accent);text-decoration:none;">View all →</a>
    </div>
    <div class="recent-list" id="recentList"></div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../data/challenges.js"></script>
  <script>
    const user = QQ.getUser();
    if (!user) window.location.href = 'login.html';

    function render() {
      document.getElementById('dashUsername').textContent = user.username;
      document.getElementById('navUsername').textContent = user.username;
      document.getElementById('dashLevel').textContent = `Current tier: ${user.level || 'Rookie'} · Joined ${new Date(user.joinedAt).toLocaleDateString()}`;
      document.getElementById('statXP').textContent = user.xp || 0;

      const progress = QQ.getProgress();
      const solved = Object.values(progress).filter(p => p.solved).length;
      document.getElementById('statSolved').textContent = solved;

      // Rank
      const board = JSON.parse(localStorage.getItem('qq_leaderboard') || '[]');
      const rank = board.findIndex(e => e.username === user.username) + 1;
      document.getElementById('statRank').textContent = rank > 0 ? '#' + rank : '#—';

      const currentTier = TIERS.find(t => t.name === (user.level || 'Rookie')) || TIERS[0];
      document.getElementById('statTier').textContent = currentTier.icon;

      // XP bar
      const tierIdx = TIERS.findIndex(t => t.name === (user.level || 'Rookie'));
      const xp = user.xp || 0;
      const currentXPMin = TIERS[tierIdx]?.minXP || 0;
      const nextTier = TIERS[tierIdx + 1];
      const nextXP = nextTier ? nextTier.minXP : 9999;
      const pct = nextTier ? Math.min(((xp - currentXPMin) / (nextXP - currentXPMin)) * 100, 100) : 100;
      document.getElementById('xpBarFill').style.width = pct + '%';
      document.getElementById('xpLabel').textContent = xp + ' XP';
      document.getElementById('xpNextLabel').textContent = nextTier ? `Next: ${nextTier.name} (${nextXP} XP)` : 'Max tier reached!';

      // Tier rows
      const tierDiv = document.getElementById('tierProgress');
      TIERS.forEach(tier => {
        const tierChallenges = CHALLENGES_DATA.filter(c => c.tierName === tier.name);
        const tierSolved = tierChallenges.filter(c => progress[c.id]?.solved).length;
        const isActive = tier.name === (user.level || 'Rookie');
        const isUnlocked = xp >= tier.minXP;
        tierDiv.innerHTML += `
          <div class="tier-row ${isActive ? 'active' : ''}">
            <div class="tier-icon">${isUnlocked ? tier.icon : '🔒'}</div>
            <div class="tier-info">
              <div class="tier-name">${tier.name}</div>
              <div class="tier-challenges">${tierChallenges.length} challenges · ${tier.minXP} XP required</div>
            </div>
            <div class="tier-status ${isUnlocked ? 'solved-green' : 'locked-dim'}">
              ${isUnlocked ? `${tierSolved}/${tierChallenges.length} solved` : 'Locked'}
            </div>
          </div>
        `;
      });

      // Recent solves
      const recentDiv = document.getElementById('recentList');
      const recentSolves = Object.entries(progress)
        .filter(([,v]) => v.solved)
        .sort((a,b) => b[1].solvedAt - a[1].solvedAt)
        .slice(0, 5);

      if (recentSolves.length === 0) {
        recentDiv.innerHTML = `<div class="empty-state"><p>No challenges solved yet.</p><a href="challenges.html" class="btn-primary">Start Now →</a></div>`;
      } else {
        recentSolves.forEach(([id, data]) => {
          const ch = CHALLENGES_DATA.find(c => c.id === id);
          if (!ch) return;
          recentDiv.innerHTML += `
            <div class="recent-item">
              <div>
                <div class="recent-title">${ch.title}</div>
                <div class="recent-meta">${ch.tierName} · +${ch.xp} XP</div>
              </div>
              <div>
                <span class="badge badge-${ch.tierName.toLowerCase()}">✓ Solved</span>
              </div>
            </div>
          `;
        });
      }
    }

    render();
  </script>
</body>
</html>
